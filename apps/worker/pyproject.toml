[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-wiki-worker"
version = "0.1.0"
description = "Hello Wiki document worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hello-wiki-py-worker-core",
    "redis>=5.0.0",
    "taskiq>=0.11.10",
    "taskiq-redis>=0.5.0",
    "magic-pdf>=0.6.0",
    "paddlepaddle>=2.6.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio",
]

[tool.uv.sources]
hello-wiki-py-worker-core = { path = "../../packages/py-worker-core", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = [
    "src",
    "../../packages/py-worker-core/src",
    "../backend",
]

[[tool.mypy.overrides]]
module = [
    "hello_wiki_worker.tasks",
]
disable_error_code = ["misc"]
